language: "en-US"

reviews:
  profile: "assertive"
  high_level_summary: true
  poem: false
  review_status: true
  request_changes_workflow: false

  path_filters:
    - "!**/node_modules/**"
    - "!**/vendor/**"
    - "!include/mpdf/**"
    - "!include/*/vendor/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/package-lock.json"

  path_instructions:
    - path: "orchestrator/**"
      instructions: |
        This is a Cursor SDK strangler-fig orchestrator (TypeScript).
        Focus on pipeline correctness, agent prompts, Linear/Slack wiring,
        and parity/verifier integrity. Never suggest skipping or weakening
        the parity verifier. Do not invent fixture expected values.
    - path: "include/Services/**"
      instructions: |
        Extracted PHP service classes from a strangler-fig migration.
        Prefer smallest possible changes. Services must never call back into
        the facade entry point they replace (anti-recursion). Preserve
        caller-visible contracts and side effects.
    - path: "include/class.*.php"
      instructions: |
        Legacy osTicket facades. Only review intentional strangler patches
        (delegation into include/Services/). Do not suggest broad refactors
        of unrelated legacy code.
    - path: "orchestrator/fixtures/**"
      instructions: |
        Golden parity fixtures. Flag any edits that look like inventing or
        softening expected values to make parity pass.
    - path: "legacy/harness/**"
      instructions: |
        Parity capture/compare harness. Treat behavioral drift as high severity.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "develop"
      - "demo/sla-strangler"
      - "main"

chat:
  auto_reply: true
